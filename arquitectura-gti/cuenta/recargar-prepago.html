<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recargar prepago · FacturaElectronica.cr (prototipo)</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-root="../" data-page="cuenta/recargar-prepago.html" data-layout="site">
  <div id="site-header"></div>

  <main id="main" class="container">
    <header class="page-head">
      <h1>Recargar prepago</h1>
      <p>Agregue documentos a su plan prepago ingresando el número de cédula asociado a la cuenta.</p>
    </header>

    <div class="layout-2">
      <form class="form" data-demo="Prototipo: aquí se mostrarían los paquetes de recarga disponibles.">
        <label for="cedula">Número de cédula</label>
        <input id="cedula" name="cedula" inputmode="numeric" required>
        <p class="hint">Física, jurídica, DIMEX o NITE.</p>
        <button class="btn btn--primary" type="submit">Continuar a la recarga</button>
      </form>
      <div><h2 style="margin-top:0">Información</h2><ul><li>Esta recarga aplica a planes <strong>prepago</strong>.</li><li>¿Tiene plan pospago? <a href="pagar-facturacion.html">Pague aquí</a>.</li><li>¿Necesita más documentos al mes? <a href="../planes/index.html">Compare planes pospago</a>.</li></ul></div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="../js/sitemap-data.js"></script>
  <script src="../js/search-config.js"></script>
  <script src="../js/search.js"></script>
  <script src="../js/layout.js"></script>
</body>
</html>
