<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagar facturación · FacturaElectronica.cr (prototipo)</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-root="../" data-page="cuenta/pagar-facturacion.html" data-layout="site">
  <div id="site-header"></div>

  <main id="main" class="container">
    <header class="page-head">
      <h1>Pagar facturación</h1>
      <p>Pague su plan pospago ingresando el número de cédula asociado a la cuenta.</p>
    </header>

    <div class="layout-2">
      <form class="form" data-demo="Prototipo: aquí se mostraría el detalle de la factura pendiente.">
        <label for="cedula">Número de cédula</label>
        <input id="cedula" name="cedula" inputmode="numeric" required>
        <p class="hint">Física, jurídica, DIMEX o NITE.</p>
        <button class="btn btn--primary" type="submit">Continuar al pago</button>
      </form>
      <div><h2 style="margin-top:0">Información</h2><ul><li>Este pago aplica a planes <strong>pospago</strong>.</li><li>¿Tiene plan prepago? <a href="recargar-prepago.html">Recargue aquí</a>.</li><li>Dudas de cobro: <a href="../ayuda/contacto.html">Formulario de contacto</a>.</li></ul></div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="../js/sitemap-data.js"></script>
  <script src="../js/search-config.js"></script>
  <script src="../js/search.js"></script>
  <script src="../js/layout.js"></script>
</body>
</html>
