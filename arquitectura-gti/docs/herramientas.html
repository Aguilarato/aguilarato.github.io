  var ESTADO = { hecho: "Completado", parcial: "Parcial", pendiente: "Pendiente" };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  document.getElementById("indice").innerHTML = TOOLS.map(function (t) {

    return '<section class="tool" id="' + t.id + '" aria-labelledby="h-' + t.id + '">' +

      "<p>" + esc(t.uso) + "</p>" + (t.nota ? '<p class="tool__note">' + esc(t.nota) + "</p>" : "") +

  var visor = document.getElementById("visor");

    var b = e.target.closest(".shot button"); if (!b) return;
    var img = document.getElementById("visor-img"); img.src = b.dataset.src; img.alt = b.dataset.cap;
